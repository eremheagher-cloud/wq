name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      shell: powershell
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow

        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan

        Get-ComputerInfo |
          Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory

        Get-CimInstance Win32_Processor |
          Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

        Write-Host "`n=== ARCHITECTURE ===" -ForegroundColor Cyan
        Write-Host "PROCESSOR_ARCHITECTURE: $env:PROCESSOR_ARCHITECTURE"
        Write-Host "PROCESSOR_ARCHITEW6432: $env:PROCESSOR_ARCHITEW6432"

    - name: Enable RDP
      shell: powershell
      run: |
        Write-Host "Enabling Remote Desktop..." -ForegroundColor Green

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 1

        Enable-NetFirewallRule `
          -DisplayGroup "Remote Desktop" `
          -ErrorAction SilentlyContinue

        Write-Host "Remote Desktop enabled successfully." -ForegroundColor Green

    - name: Create User Account
      shell: powershell
      run: |
        Write-Host "Setting up user account..." -ForegroundColor Green

        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force

        $user = Get-LocalUser `
          -Name "runneradmin" `
          -ErrorAction SilentlyContinue

        if ($user) {
          Write-Host "runneradmin already exists." -ForegroundColor Yellow
          Write-Host "Updating password..." -ForegroundColor Yellow

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $Password
        }
        else {
          Write-Host "Creating runneradmin..." -ForegroundColor Yellow

          New-LocalUser `
            -Name "runneradmin" `
            -Password $Password `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword
        }

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member "runneradmin" `
          -ErrorAction SilentlyContinue

        Write-Host "Username: runneradmin" -ForegroundColor Yellow
        Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow

        # Criar conta Rafael como Administrador (senha será definida dentro do Windows)
        $rafael = Get-LocalUser -Name "Rafael" -ErrorAction SilentlyContinue
        if (-not $rafael) {
          Write-Host "Creating Rafael as Administrator..." -ForegroundColor Yellow
          $tempPass = ConvertTo-SecureString "TempPass123!" -AsPlainText -Force
          New-LocalUser `
            -Name "Rafael" `
            -Password $tempPass `
            -AccountNeverExpires `
            -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Rafael" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Rafael" -ErrorAction SilentlyContinue
          Write-Host "Rafael created as Administrator. Set password inside Windows." -ForegroundColor Green
        }
        else {
          Write-Host "Rafael already exists." -ForegroundColor Yellow
          Add-LocalGroupMember -Group "Administrators" -Member "Rafael" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Rafael" -ErrorAction SilentlyContinue
        }

    - name: Prepare Tailscale Dependencies
      shell: powershell
      run: |
        Write-Host "=== PREPARING TAILSCALE DEPENDENCIES ===" -ForegroundColor Green

        $requiredServices = @(
          "Dnscache",
          "iphlpsvc",
          "netprofm",
          "WinHttpAutoProxySvc"
        )

        foreach ($serviceName in $requiredServices) {
          Write-Host "`nChecking service: $serviceName" -ForegroundColor Yellow

          $service = Get-Service `
            -Name $serviceName `
            -ErrorAction SilentlyContinue

          if (-not $service) {
            Write-Host "$serviceName was not found." -ForegroundColor Yellow
            continue
          }

          Write-Host "Current status: $($service.Status)" -ForegroundColor Cyan

          if ($service.StartType -eq "Disabled") {
            Write-Host "Enabling $serviceName..." -ForegroundColor Yellow

            Set-Service `
              -Name $serviceName `
              -StartupType Automatic `
              -ErrorAction SilentlyContinue
          }

          if ((Get-Service -Name $serviceName).Status -ne "Running") {
            Write-Host "Starting $serviceName..." -ForegroundColor Yellow

            Start-Service `
              -Name $serviceName `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3
          }

          $current = Get-Service `
            -Name $serviceName `
            -ErrorAction SilentlyContinue

          if ($current) {
            Write-Host "$serviceName final status: $($current.Status)" -ForegroundColor Green
          }
        }

    - name: Install Tailscale
      shell: powershell
      run: |
        Write-Host "=== INSTALLING TAILSCALE ===" -ForegroundColor Green

        $installerPath = "$env:TEMP\tailscale-setup.exe"

        if (Test-Path $installerPath) {
          Remove-Item `
            $installerPath `
            -Force `
            -ErrorAction SilentlyContinue
        }

        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4.exe"

        Write-Host "Downloading Tailscale..." -ForegroundColor Yellow
        Write-Host $tsUrl -ForegroundColor Cyan

        try {
          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing `
            -ErrorAction Stop
        }
        catch {
          Write-Host "Tailscale download failed." -ForegroundColor Red
          Write-Host $_.Exception.Message -ForegroundColor Red
          exit 1
        }

        if (-not (Test-Path $installerPath)) {
          Write-Host "Tailscale installer was not downloaded." -ForegroundColor Red
          exit 1
        }

        $installerSize = (Get-Item $installerPath).Length

        Write-Host "Installer size: $installerSize bytes" -ForegroundColor Cyan

        if ($installerSize -lt 1000000) {
          Write-Host "Invalid or incomplete Tailscale installer." -ForegroundColor Red
          exit 1
        }

        Write-Host "Installing Tailscale..." -ForegroundColor Green

        $installProcess = Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/quiet" `
          -Wait `
          -PassThru

        Write-Host "Installer exit code: $($installProcess.ExitCode)" -ForegroundColor Cyan

        if ($installProcess.ExitCode -ne 0) {
          Write-Host "Tailscale installation failed." -ForegroundColor Red
          Write-Host "Exit code: $($installProcess.ExitCode)" -ForegroundColor Red

          Remove-Item `
            $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

          exit $installProcess.ExitCode
        }

        Remove-Item `
          $installerPath `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "Tailscale installed successfully!" -ForegroundColor Green

        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

        if (-not (Test-Path $tailscaleExe)) {
          Write-Host "Tailscale executable was not found." -ForegroundColor Red
          exit 1
        }

        Write-Host "Tailscale executable found." -ForegroundColor Green

        & $tailscaleExe version

    - name: Start Tailscale
      shell: powershell
      run: |
        Write-Host "=== STARTING TAILSCALE ===" -ForegroundColor Green

        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

        if (-not (Test-Path $tailscaleExe)) {
          Write-Host "Tailscale executable not found." -ForegroundColor Red
          exit 1
        }

        Write-Host "Checking Tailscale service..." -ForegroundColor Yellow

        $service = Get-Service `
          -Name "Tailscale" `
          -ErrorAction SilentlyContinue

        if (-not $service) {
          Write-Host "Tailscale service was not found." -ForegroundColor Red
          exit 1
        }

        if ($service.Status -ne "Running") {
          Write-Host "Starting Tailscale service..." -ForegroundColor Yellow

          Start-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 10
        }

        $service = Get-Service `
          -Name "Tailscale" `
          -ErrorAction SilentlyContinue

        Write-Host "Tailscale service: $($service.Status)" -ForegroundColor Green

        if ($service.Status -ne "Running") {
          Write-Host "Tailscale service failed to start." -ForegroundColor Red
          exit 1
        }

        Write-Host ""
        Write-Host "Configuring Tailscale unattended mode..." -ForegroundColor Yellow

        & $tailscaleExe set --unattended=true 2>&1

        if ($LASTEXITCODE -ne 0) {
          Write-Host "Applying Windows unattended policy..." -ForegroundColor Yellow

          $policyPath = "HKLM:\SOFTWARE\Policies\Tailscale"

          if (-not (Test-Path $policyPath)) {
            New-Item `
              -Path $policyPath `
              -Force | Out-Null
          }

          New-ItemProperty `
            -Path $policyPath `
            -Name "UnattendedMode" `
            -PropertyType String `
            -Value "always" `
            -Force | Out-Null

          Write-Host "Unattended policy configured." -ForegroundColor Green

          & $tailscaleExe syspolicy reload 2>&1

          Start-Sleep -Seconds 3
        }
        else {
          Write-Host "Unattended mode enabled." -ForegroundColor Green
        }

        Write-Host ""
        Write-Host "Disabling Tailscale DNS configuration..." -ForegroundColor Yellow

        & $tailscaleExe set --accept-dns=false 2>&1

        Start-Sleep -Seconds 3

        Write-Host ""
        Write-Host "Connecting Tailscale..." -ForegroundColor Green

        & $tailscaleExe up `
          --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
          --hostname="PC-criado-pelo-alves7.pcm" `
          --accept-routes `
          --accept-dns=false `
          --unattended `
          --timeout=120s

        $upExitCode = $LASTEXITCODE

        Write-Host ""
        Write-Host "tailscale up exit code: $upExitCode" -ForegroundColor Cyan

        if ($upExitCode -ne 0) {
          Write-Host "Tailscale authentication failed." -ForegroundColor Red

          Write-Host "`n=== TAILSCALE STATUS ===" -ForegroundColor Yellow
          & $tailscaleExe status 2>&1

          exit 1
        }

        Write-Host "Tailscale authentication completed." -ForegroundColor Green

        Write-Host ""
        Write-Host "Waiting for Tailscale to leave NoState..." -ForegroundColor Yellow

        $connected = $false
        $tsIP = $null

        for ($i = 1; $i -le 24; $i++) {
          Start-Sleep -Seconds 5

          Write-Host "Connection check $i/24..." -ForegroundColor Yellow

          $statusOutput = (
            & $tailscaleExe status 2>&1 |
            Out-String
          )

          if (
            $statusOutput -notmatch "NoState" -and
            $statusOutput -notmatch "NeedsLogin"
          ) {
            $ipResult = (
              & $tailscaleExe ip -4 2>&1 |
              Select-Object -First 1
            )

            $candidate = $ipResult.ToString().Trim()

            if ($candidate -match "^\d{1,3}(\.\d{1,3}){3}$") {
              $tsIP = $candidate
              $connected = $true

              Write-Host ""
              Write-Host "========================================" -ForegroundColor Green
              Write-Host "TAILSCALE CONNECTED" -ForegroundColor Green
              Write-Host "IP: $tsIP" -ForegroundColor Green
              Write-Host "========================================" -ForegroundColor Green

              break
            }
          }

          Write-Host "Tailscale is still initializing..." -ForegroundColor DarkYellow
        }

        if (-not $connected) {
          Write-Host ""
          Write-Host "Tailscale did not obtain an IPv4 address." -ForegroundColor Red

          Write-Host "`n=== FINAL TAILSCALE STATUS ===" -ForegroundColor Yellow
          & $tailscaleExe status 2>&1

          Write-Host "`n=== TAILSCALE GET ===" -ForegroundColor Yellow
          & $tailscaleExe get 2>&1

          Write-Host "`n=== TAILSCALE DAEMON LOG ===" -ForegroundColor Yellow
          & $tailscaleExe debug daemon-logs 2>&1

          exit 1
        }

        Write-Host ""
        Write-Host "Tailscale is fully ready." -ForegroundColor Green

    - name: Get Tailscale IP
      shell: powershell
      run: |
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

        $tsIP = $null

        for ($i = 1; $i -le 12; $i++) {
          Start-Sleep -Seconds 3

          $result = & $tailscaleExe ip -4 2>&1

          $candidate = (
            $result |
            Select-Object -First 1
          ).ToString().Trim()

          if ($candidate -match "^\d{1,3}(\.\d{1,3}){3}$") {
            $tsIP = $candidate
            break
          }

          Write-Host "Waiting for Tailscale IP... $i/12" -ForegroundColor Yellow
        }

        if (-not $tsIP) {
          Write-Host "Unable to obtain Tailscale IPv4." -ForegroundColor Red

          & $tailscaleExe status 2>&1

          exit 1
        }

        Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green

        "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

    - name: Install Google Chrome (Direct)
      shell: powershell
      run: |
        Write-Host "Downloading Google Chrome..." -ForegroundColor Green

        $chromeUrl = "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise_arm64.msi"

        $installerPath = "$env:TEMP\chrome_installer.msi"

        Invoke-WebRequest `
          -Uri $chromeUrl `
          -OutFile $installerPath `
          -UseBasicParsing

        Write-Host "Installing Google Chrome silently..." -ForegroundColor Green

        Start-Process `
          msiexec.exe `
          -ArgumentList "/i `"$installerPath`" /qn /norestart" `
          -Wait

        Remove-Item `
          $installerPath `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "Google Chrome installed!" -ForegroundColor Green

    - name: Install 7-Zip (Direct)
      shell: powershell
      run: |
        Write-Host "Downloading 7-Zip..." -ForegroundColor Green

        $zipUrl = "https://www.7-zip.org/a/7z2409-arm64.exe"

        $installerPath = "$env:TEMP\7z-installer.exe"

        Invoke-WebRequest `
          -Uri $zipUrl `
          -OutFile $installerPath `
          -UseBasicParsing

        Write-Host "Installing 7-Zip silently..." -ForegroundColor Green

        Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/S" `
          -Wait

        Remove-Item `
          $installerPath `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "7-Zip installed!" -ForegroundColor Green

    - name: Connection Details
      shell: powershell
      run: |
        Write-Host "`n=== CONNECTION DETAILS (TAILSCALE) ===" -ForegroundColor Green

        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "        ENIGMANO RDP ACCESS" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan

        Write-Host "Host: $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host "Username: runneradmin" -ForegroundColor White
        Write-Host "Password: P@ssw0rd!" -ForegroundColor White

        Write-Host "========================================" -ForegroundColor Cyan

        Write-Host "`nConnection Instructions:" -ForegroundColor Yellow
        Write-Host "1. Install Tailscale on your device." -ForegroundColor White
        Write-Host "2. Connect to the same Tailscale account." -ForegroundColor White
        Write-Host "3. Open Remote Desktop." -ForegroundColor White
        Write-Host "4. Enter the Tailscale IP shown above." -ForegroundColor White
        Write-Host "5. Username: runneradmin" -ForegroundColor White
        Write-Host "6. Password: P@ssw0rd!" -ForegroundColor White

    - name: Keep Session Alive
      shell: powershell
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "EnigMano RDP instance is now running!" -ForegroundColor Cyan
        Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow
        Write-Host "Do not close this workflow." -ForegroundColor Red

        $counter = 0

        while ($true) {
          $counter++

          Write-Host ""
          Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green

          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          $ipResult = & $tailscaleExe ip -4 2>&1

          $tsIP = (
            $ipResult |
            Select-Object -First 1
          ).ToString().Trim()

          if ($tsIP -match "^\d{1,3}(\.\d{1,3}){3}$") {
            Write-Host "Tailscale status: ACTIVE" -ForegroundColor Green
            Write-Host "Tailscale IP: $tsIP" -ForegroundColor Cyan
          }
          else {
            Write-Host "Tailscale IP unavailable." -ForegroundColor Red
            Write-Host "Attempting to reconnect..." -ForegroundColor Yellow

            $service = Get-Service `
              -Name "Tailscale" `
              -ErrorAction SilentlyContinue

            if ($service -and $service.Status -ne "Running") {
              Start-Service `
                -Name "Tailscale" `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 10
            }

            & $tailscaleExe set --unattended=true 2>&1

            & $tailscaleExe set --accept-dns=false 2>&1

            & $tailscaleExe up `
              --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
              --hostname="PC-criado-pelo-alves7.pcm" `
              --accept-routes `
              --accept-dns=false `
              --unattended `
              --timeout=120s

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Tailscale reconnect command completed." -ForegroundColor Green
            }
            else {
              Write-Host "Tailscale reconnect failed." -ForegroundColor Red
            }
          }

          Start-Sleep -Seconds 60
        }
